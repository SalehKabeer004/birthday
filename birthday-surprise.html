<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff3f6">
<title>A Birthday Surprise 🎂</title>
<style>
:root{--pink:#ff5b87;--deep:#b83160;--ink:#402837;--cream:#fff8f1}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 15%,#fff 0 2px,transparent 3px),linear-gradient(145deg,#ffe7ef,#fff4e5 55%,#f1e8ff);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.card{width:min(92vw,440px);padding:34px 25px 27px;text-align:center;border:1px solid #ffffffc9;border-radius:28px;background:#ffffffd9;box-shadow:0 22px 65px #9e466624;backdrop-filter:blur(10px);position:relative;z-index:2}
.badge{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--deep);font-weight:800}.sparkle{font-size:22px;margin:7px 0 4px}h1{font-size:clamp(30px,9vw,42px);line-height:1.12;margin:8px 0;color:#a72f5b}p{line-height:1.65;color:#715762;margin:10px auto}.name{color:#e44778}.gift{font-size:82px;line-height:1.2;margin:13px 0 6px;display:inline-block;filter:drop-shadow(0 9px 8px #d45b7940);transition:transform .35s;animation:bob 2.2s ease-in-out infinite}.gift.open{animation:pop .55s ease both}@keyframes bob{50%{transform:translateY(-7px) rotate(2deg)}}@keyframes pop{45%{transform:scale(1.28) rotate(-9deg)}100%{transform:scale(1)}}button{border:0;border-radius:999px;background:linear-gradient(100deg,#ff5b87,#e74778);color:white;padding:14px 24px;font:700 16px system-ui;box-shadow:0 8px 22px #e7477842;cursor:pointer;transition:transform .2s,filter .2s}button:hover{transform:translateY(-2px);filter:brightness(1.04)}button:focus-visible{outline:3px solid #402837;outline-offset:4px}.wish{display:none;margin:20px auto 0;padding:17px 15px;border-radius:18px;background:#fff4f7;animation:appear .5s ease both}.wish.show{display:block}.wish p{margin:6px 0}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.controls{display:flex;justify-content:center;gap:10px;margin-top:16px}.controls button{font-size:13px;padding:10px 15px;background:#fff;color:#a72f5b;border:1px solid #f4c5d3;box-shadow:none}.controls button.active{background:#a72f5b;color:white;border-color:#a72f5b}.foot{font-size:12px;margin:19px 0 0;color:#9b7e89}.float{position:fixed;bottom:-70px;z-index:1;font-size:26px;opacity:.7;animation:rise linear forwards;pointer-events:none}@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}.confetti{position:fixed;top:-12px;width:9px;height:13px;z-index:5;pointer-events:none;animation:fall 2.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:.2}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="card">
  <div class="badge">A little surprise for you</div>
  <div class="sparkle" aria-hidden="true">✨ 🎈 ✨</div>
  <h1>Happy Birthday,<br><span class="name" id="personName">Bestie</span>! 🎂</h1>
  <p>A tiny page, made with lots of love.<br>Ready to open your surprise?</p>
  <div class="gift" id="gift" aria-hidden="true">🎁</div>
  <div><button id="openBtn">Open your surprise ✨</button></div>
  <section class="wish" id="wish" aria-live="polite">
    <h2 style="margin:0;color:#b83160">Make a wish! 🥳</h2>
    <p>May your new year be full of laughter, beautiful moments, and everything that makes you smile. You deserve the very best! 💖</p>
  </section>
  <div class="controls">
    <button id="songBtn" type="button" aria-pressed="false">▶ Play birthday song</button>
    <button id="replayBtn" type="button">↻ Replay</button>
  </div>
  <p class="foot">Made with care by Saleh 💌</p>
</main>
<script>
// Edit the name and message here. The tune is generated in-browser, so no audio file is needed.
const PERSON_NAME = 'Bestie';
const nameEl=document.getElementById('personName'); nameEl.textContent=PERSON_NAME;
const gift=document.getElementById('gift'), wish=document.getElementById('wish'), openBtn=document.getElementById('openBtn');
let audioCtx=null, playing=false, timers=[];
function confetti(){const colors=['#ff5b87','#ffc857','#7ac9a5','#9b82e8','#5db9e8'];for(let i=0;i<48;i++){const el=document.createElement('i');el.className='confetti';el.style.left=Math.random()*100+'vw';el.style.background=colors[i%colors.length];el.style.animationDelay=Math.random()*.65+'s';el.style.transform=`rotate(${Math.random()*180}deg)`;document.body.appendChild(el);setTimeout(()=>el.remove(),3400)}}
function floatDecor(){for(let i=0;i<7;i++){const el=document.createElement('span');el.className='float';el.textContent=['🎈','💖','✨','🌟'][i%4];el.style.left=Math.random()*95+'vw';el.style.animationDuration=(6+Math.random()*5)+'s';el.style.animationDelay=(Math.random()*.9)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),12000)}}
function reveal(){gift.classList.remove('open');void gift.offsetWidth;gift.classList.add('open');wish.classList.add('show');openBtn.textContent='Surprise opened! 🎉';confetti();floatDecor()}
openBtn.addEventListener('click',reveal);
function stopSong(){timers.forEach(clearTimeout);timers=[];playing=false;document.getElementById('songBtn').textContent='▶ Play birthday song';document.getElementById('songBtn').classList.remove('active');document.getElementById('songBtn').setAttribute('aria-pressed','false')}
function playSong(){const btn=document.getElementById('songBtn');if(playing){stopSong();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC){alert('Audio playback is not supported in this browser.');return}audioCtx=audioCtx||new AC();audioCtx.resume();playing=true;btn.textContent='■ Stop birthday song';btn.classList.add('active');btn.setAttribute('aria-pressed','true');
// A short, synthesized Happy Birthday melody (no downloaded song/audio).
const melody=[[392,0],[392,.28],[440,.56],[392,.84],[523,1.12],[494,1.52],[392,2.05],[392,2.33],[440,2.61],[392,2.89],[587,3.17],[523,3.57],[392,4.1],[392,4.38],[784,4.66],[659,4.94],[523,5.22],[494,5.5],[440,5.9],[698,6.43],[698,6.71],[659,6.99],[523,7.27],[587,7.55],[523,7.95]];const start=audioCtx.currentTime+.08;
melody.forEach(([freq,t])=>{const timer=setTimeout(()=>{if(!playing)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.13,audioCtx.currentTime+.025);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.25);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.27)},Math.max(0,(start-audioCtx.currentTime+t)*1000));timers.push(timer)});timers.push(setTimeout(stopSong,8500))}
document.getElementById('songBtn').addEventListener('click',playSong);
document.getElementById('replayBtn').addEventListener('click',()=>{stopSong();wish.classList.remove('show');gift.classList.remove('open');openBtn.textContent='Open your surprise ✨';window.scrollTo({top:0,behavior:'smooth'})});
</script>
</body>
</html>
